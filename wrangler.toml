name = "mancraft"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
FIREBASE_PROJECT_ID = "man-craft-a06db"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "REG"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_classes = ["Lobby"]

[[migrations]]
tag = "v2"
new_classes = ["Registry"]
